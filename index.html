<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hola mundo</title>
        <style>
            body {
                align-items: center;
                background: #0d0d0d;
                color: #f5f5f5;
                display: flex;
                font-family: Arial, sans-serif;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                padding: 1.5rem;
            }

            .card {
                background: #181818;
                border: 1px solid #3a3a3a;
                border-radius: 18px;
                box-shadow:
                    0 24px 60px rgba(0, 0, 0, 0.45),
                    inset 0 1px 0 rgba(255, 255, 255, 0.08);
                max-width: 32rem;
                padding: 3.5rem 3rem;
                text-align: center;
                width: 100%;
            }

            h1 {
                font-size: clamp(2rem, 8vw, 3.5rem);
                letter-spacing: -0.06em;
                margin: 0 0 1rem;
            }

            p {
                color: #a3a3a3;
                line-height: 1.6;
                margin: 0;
            }
        </style>
    </head>
    <body>
        <main class="card">
            <h1>Hola mundo. 🦭</h1>
            <p>
                Agregué este archivo como parte de la práctica de control de
                versiones.
            </p>
        </main>
    </body>
</html>
